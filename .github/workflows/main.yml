name: Build SoftChat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Create Android project
        run: |
          mkdir -p buildapp/app/src/main/java/com/softchat/app
          mkdir -p buildapp/app/src/main/res/values

          printf '%s\n' \
          'pluginManagement {' \
          '    repositories {' \
          '        google()' \
          '        mavenCentral()' \
          '        gradlePluginPortal()' \
          '    }' \
          '}' \
          '' \
          'rootProject.name = "SoftChat"' \
          'include(":app")' \
          > buildapp/settings.gradle

          printf '%s\n' \
          'plugins {' \
          '    id "com.android.application" version "8.6.1" apply false' \
          '}' \
          > buildapp/build.gradle

          printf '%s\n' \
          'plugins {' \
          '    id "com.android.application"' \
          '}' \
          '' \
          'android {' \
          '    namespace "com.softchat.app"' \
          '    compileSdk 35' \
          '' \
          '    defaultConfig {' \
          '        applicationId "com.softchat.app"' \
          '        minSdk 23' \
          '        targetSdk 35' \
          '        versionCode 1' \
          '        versionName "1.0"' \
          '    }' \
          '}' \
          > buildapp/app/build.gradle

          printf '%s\n' \
          '<?xml version="1.0" encoding="utf-8"?>' \
          '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
          '    <uses-permission android:name="android.permission.INTERNET" />' \
          '    <application android:theme="@style/AppTheme" android:label="SoftChat">' \
          '        <activity android:name=".MainActivity" android:exported="true">' \
          '            <intent-filter>' \
          '                <action android:name="android.intent.action.MAIN" />' \
          '                <category android:name="android.intent.category.LAUNCHER" />' \
          '            </intent-filter>' \
          '        </activity>' \
          '    </application>' \
          '</manifest>' \
          > buildapp/app/src/main/AndroidManifest.xml

          printf '%s\n' \
          '<resources>' \
          '    <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">' \
          '        <item name="android:fontFamily">sans</item>' \
          '        <item name="android:colorAccent">#D9A7B5</item>' \
          '        <item name="android:navigationBarColor">#FFF9F5</item>' \
          '        <item name="android:statusBarColor">#FFF9F5</item>' \
          '        <item name="android:windowLightStatusBar">true</item>' \
          '    </style>' \
          '</resources>' \
          > buildapp/app/src/main/res/values/styles.xml

          printf '%s\n' \
          'package com.softchat.app;' \
          '' \
          'import android.app.Activity;' \
          'import android.os.Bundle;' \
          'import android.webkit.WebSettings;' \
          'import android.webkit.WebView;' \
          'import android.webkit.WebViewClient;' \
          '' \
          'public class MainActivity extends Activity {' \
          '    @Override' \
          '    protected void onCreate(Bundle savedInstanceState) {' \
          '        super.onCreate(savedInstanceState);' \
          '        WebView web = new WebView(this);' \
          '        setContentView(web);' \
          '        WebSettings settings = web.getSettings();' \
          '        settings.setJavaScriptEnabled(true);' \
          '        settings.setDomStorageEnabled(true);' \
          '        web.setWebViewClient(new WebViewClient());' \
          '        web.loadUrl("https://chatgpt.com/");' \
          '    }' \
          '}' \
          > buildapp/app/src/main/java/com/softchat/app/MainActivity.java

      - name: Build APK
        working-directory: buildapp
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoftChat-debug
          path: buildapp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
