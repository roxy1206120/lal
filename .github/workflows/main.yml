name: Build SoftChat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Create Android project
        run: |
          mkdir -p buildapp/app/src/main/java/com/softchat/app
          mkdir -p buildapp/app/src/main/res/values

          cat > buildapp/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SoftChat"
          include(":app")
          EOF

          cat > buildapp/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > buildapp/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.softchat.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.softchat.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > buildapp/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:theme="@style/AppTheme"
                  android:label="SoftChat"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > buildapp/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#D9A7B5</item>
                  <item name="android:navigationBarColor">#FFF9F5</item>
                  <item name="android:statusBarColor">#FFF9F5</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

          cat > buildapp/app/src/main/java/com/softchat/app/MainActivity.java <<'EOF'
          package com.softchat.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setUserAgentString(s.getUserAgentString() + " SoftChat/1.0");

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          String css =
                              "body{background:#fff9f5!important;}" +
                              "textarea{background:#fffdfb!important;border-radius:22px!important;" +
                              "border:1px solid #ead7d7!important;}" +
                              "[data-message-author-role='user']{background:#f7dfe5!important;" +
                              "border-radius:22px!important;}" +
                              "[data-message-author-role='assistant']{background:#fffdfb!important;" +
                              "border-radius:22px!important;}";

                          String js =
                              "javascript:(function(){" +
                              "var s=document.getElementById('softchat-style');" +
                              "if(!s){s=document.createElement('style');s.id='softchat-style';" +
                              "s.innerHTML=" + quote(css) + ";document.head.appendChild(s);}" +
                              "})()";

                          view.evaluateJavascript(js, null);
                      }
                  });

                  web.loadUrl("https://chatgpt.com/");
              }

              private static String quote(String s) {
                  return "'" + s.replace("\\", "\\\\")
                          .replace("'", "\\'")
                          .replace("\n", "") + "'";
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      - name: Build APK
        working-directory: buildapp
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoftChat-debug
          path: buildapp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
